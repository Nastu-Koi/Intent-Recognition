# general_chat Agent Card
# 通用对话 Agent — 内置图像识别与文档总结工具

metadata:
  agent_id: general_chat
  name: 通用对话助手
  description: "通用对话助手，支持日常闲聊和问答。内置图像识别工具，可对用户上传的图片执行 OCR 文字提取、场景内容描述、发票/票据信息识别。内置文档总结工具，可对报告、合同等文档进行要点提炼和摘要生成。"
  version: "1.0.0"
  category: "general"
  author: "System"

capabilities:
  skills:
    - general_conversation
    - image_recognition
    - ocr
    - invoice_recognition
    - document_summary
  keywords:
    - 对话
    - 图片识别
    - OCR
    - 发票识别
    - 文档总结
  intent_patterns:
    - general_chat
    - 识别图片
    - OCR
    - 发票识别
    - 总结文档
  confidence_threshold: 0.5
  priority: 50

configuration:
  max_iterations: 5
  timeout: 180
  max_input_length: 50000
  temperature: 0.7

execution:
  module: "agents.general_chat.subagent"
  class_name: "GeneralChatAgent"
  mode: "sync"

dependencies:
  python_packages:
    - requests
    - langchain_openai
  external_services:
    - dify_api
    - llm_api

scope:
  - 日常聊天与通用问答
  - 图片/截图内容识别 (OCR、场景分析)
  - 发票/票据识别
  - 文档总结与要点提炼
  - 报告、合同等文档格式分析

examples:
  - 你好，有什么可以帮你的吗
  - 帮我识别这张发票上的金额
  - 这张截图上写了什么
  - 帮我总结这份合同的关键条款
  - 这份季度报告的核心内容是什么
  - 分析一下这张图片的内容
